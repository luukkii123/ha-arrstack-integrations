# Integration Quality Scale — geprüft am 05.10.2026.
# Alle aktuellen Bronze-Regeln; tests_ha dokumentiert reproduzierbare Nachweise.
# Siehe Verwaltungsreview 2026-10-05-bronze-nachweise.md für die Grenzen.
rules:
  action-setup:
    status: exempt
    comment: >-
      Die Integration registriert keine Aktionen. Was sie auslöst — neu
      einlesen, Warteschlange aufräumen, anhalten, fortsetzen — sind
      `button`-Entitäten, dazu kommen WebSocket-Kommandos fürs Frontend.
  appropriate-polling:
    status: done
    comment: >-
      `DataUpdateCoordinator` je Eintrag, Vorgabe 60 s (15–3600 einstellbar).
      Teure Abfragen laufen nur in jedem n-ten Takt (`_slow_due`), damit das
      kurze Intervall nicht den ganzen Datensatz zieht.
  brands: done
  common-modules:
    status: done
    comment: >-
      Coordinator in `coordinator.py`, gemeinsame Entitätsbasis
      `ArrstackEntity` in `entity.py`, HTTP-Clients in `api.py`.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py führt echte HA-Flowmanager aus. Config-,
      Options- und vorhandene Reauth/Reconfigure-Flows einschließlich
      Fehler-Recovery und Dubletten: 100 % Zeilen- und Zweigabdeckung,
      --cov-branch --cov-fail-under=100, HA 2026.7.0 und 2026.9.2.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: Keine externen requirements; HTTP-Client kommt von Home Assistant.
  docs-actions:
    status: exempt
    comment: Die Integration registriert keine Aktionen.
  docs-triggers:
    status: exempt
    comment: Keine eigenen Automations-Trigger bereitgestellt.
  docs-conditions:
    status: exempt
    comment: Keine eigenen Automations-Bedingungen bereitgestellt.
  docs-high-level-description:
    status: done
    comment: README, Kopf und Abschnitt „Jeder Dienst ist optional".
  docs-installation-instructions:
    status: done
    comment: README, Abschnitt „Installation".
  docs-removal-instructions:
    status: done
    comment: README, Abschnitt „Entfernen".
  entity-event-setup:
    status: done
    comment: >-
      CoordinatorEntity registriert Listener in async_added_to_hass und
      entfernt sie über async_on_remove.
  entity-unique-id:
    status: done
    comment: "`entity.py`: `_attr_unique_id = f\"{entry.entry_id}_{description.key}\"`."
  has-entity-name:
    status: done
    comment: "`entity.py`: `_attr_has_entity_name = True`."
  runtime-data:
    status: done
    comment: >-
      `entry.runtime_data` hält `ArrstackRuntime`; `hass.data` trägt nur den
      Merker, dass die WebSocket-Kommandos schon registriert sind — die hängen
      an keinem einzelnen Eintrag.
  test-before-configure:
    status: done
    comment: >-
      `validate_connection()` fragt den Dienst einmal an und liest seine
      Version, bevor der Eintrag entsteht; dieselbe Prüfung läuft im
      Reauth-Schritt, bevor der alte Schlüssel ersetzt wird.
  test-before-setup:
    status: done
    comment: "`async_setup_entry` ruft `async_config_entry_first_refresh()`."
  unique-config-entry:
    status: done
    comment: >-
      `async_set_unique_id(f\"{service}:{url}\")` plus
      `_abort_if_unique_id_configured()`. Die Adresse ist die normalisierte
      Eingabe des Nutzers — bei einem Hostnamen also gerade nicht IP-abhängig.
